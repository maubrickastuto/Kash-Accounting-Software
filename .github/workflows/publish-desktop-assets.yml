name: Upload prepared desktop release
on:
  push:
    branches: ["release/desktop-*"]
    paths:
      - "release-plan.json"
      - "scripts/publish-prepared-release.mjs"
      - ".github/workflows/publish-desktop-assets.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepared-desktop-release
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'maubrickastuto/Kash-Accounting-Software' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify and upload the prepared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-prepared-release.mjs
